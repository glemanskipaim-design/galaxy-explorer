# Galaxy Explorer — nginx da beta: serve o build do Vite e repassa /api/ ao backend.
#
# Mesma origem para app e API: o navegador so fala com este servidor, o que mantem
# compativeis o CORP same-origin das imagens e o CSP img-src 'self'. O backend nao
# tem porta publicada no host; so este proxy o alcanca, pela rede interna do compose.

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # A API so recebe JSON pequeno (POST /api/v1/imports); nada de upload.
    client_max_body_size 16k;

    # Headers de seguranca (valem para todas as respostas deste server; nenhuma location
    # abaixo usa add_header, entao nada e perdido por heranca do nginx).
    # CSP de producao: nenhum script/estilo/fonte de terceiros, sem inline (o build do
    # Vite gera so <script type=module src> e <link rel=stylesheet>; o style={{}} do
    # React e aplicado via CSSOM, que o CSP nao bloqueia).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; img-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O backend ja manda nosniff (e CSP proprio nas imagens): evita header duplicado.
        proxy_hide_header X-Content-Type-Options;
        proxy_read_timeout 60s;
    }

    # Arquivos com hash no nome (gerados pelo Vite): cache longo.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # SPA: rotas do React Router caem no index.html, que nunca e cacheado.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
